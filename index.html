    .note { display: flex; gap: 10px; align-items: center; color: #c2b298; font-size: 12px; letter-spacing: .05em; line-height: 1.6; }
    .ember { flex: 0 0 auto; width: 7px; height: 7px; background: #ed9270; border-radius: 50%; box-shadow: 0 0 12px #ed927077; }
    .buttons { display: flex; gap: 9px; flex-shrink: 0; }
    button { border: 1px solid #8a796053; border-radius: 30px; color: #d4c3a5; background: #ffffff03; font: inherit; font-size: 12px; padding: 10px 17px; cursor: pointer; transition: background .2s, border-color .2s; }

    noscript p { padding: 10px 20px; text-align: center; color: #cfba95; font-size: 12px; }
    @media (max-width: 600px) {
      body { padding: 26px 12px 20px; }
      header { margin-bottom: 20px; }

      .buttons { margin-left: auto; }

        <path d="M 20 43 V 20 H 43 M 1077 20 H 1100 V 43 M 20 617 V 640 H 43 M 1077 640 H 1100 V 617" fill="none" stroke="#e0c191" stroke-opacity=".3" stroke-width="1"/>
        <text x="37" y="52" fill="#c4b99f" font-family="system-ui, sans-serif" font-size="9" letter-spacing="3" opacity=".75">RIDE THE WIND</text>
      </svg>

      <div class="bar">
        <div class="note"><span class="ember" aria-hidden="true"></span><span id="status" aria-live="polite">风火轮已就位，出发！</span></div>
        <div class="buttons">
          <button id="play" type="button" aria-pressed="false">暂停片刻</button>
          <button id="speed" type="button" aria-pressed="false">踏风 ×1</button>
        </div>
      </div>
      <noscript><p>启用 JavaScript 后，哪吒就能开始骑行。</p></noscript>
    </section>
    <footer><span>NEZHA · A RIDE ABOVE THE CLOUDS</span><span>心有火，脚下有风。</span></footer>
  </main>

  <script>
    (() => {
      'use strict';
      const SVG_NS = 'http://www.w3.org/2000/svg';
      const $ = id => document.getElementById(id);
      const nodes = Object.fromEntries([
        'rear-flames', 'front-flames', 'rear-spokes', 'front-spokes', 'crank',
        'far-leg', 'near-leg', 'near-leg-edge', 'far-foot', 'near-foot',
        'riding-group', 'long-silk', 'silk-highlight', 'short-silk',
        'hair-ribbon', 'eye', 'mountain-layer', 'gate-layer', 'cloud-road',
        'sky-cloud-left', 'sky-cloud-right', 'riding-shadow', 'sparks'
      ].map(id => [id, $(id)]));
      const stars = [...document.querySelectorAll('.star')];
      const playButton = $('play');
      const speedButton = $('speed');
      const status = $('status');
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      let playing = !reducedMotion.matches;
      let rate = 1;
      let time = 0;
      let lastTimestamp = null;
      let request = null;
      const turn = Math.PI * 2;

      function svgElement(name, attributes) {
        const element = document.createElementNS(SVG_NS, name);
        Object.entries(attributes).forEach(([key, value]) => element.setAttribute(key, value));
        return element;
      }

      const flames = [];
      ['rear-flames', 'front-flames'].forEach((id, wheelIndex) => {
        for (let index = 0; index < 12; index++) {
          const anchor = svgElement('g', { transform: `rotate(${index * 30})` });
          const flame = svgElement('g', {});
          flame.appendChild(svgElement('path', {
            d: 'M -10 -75 C -22 -92 -5 -96 -9 -114 C 6 -106 4 -97 15 -89 Q 25 -76 8 -72 Z',
            fill: index % 2 ? '#e7764d' : '#d85846', opacity: '.87'
          }));
          flame.appendChild(svgElement('path', {
            d: 'M -5 -77 Q -12 -87 -3 -99 Q 0 -90 8 -86 Q 16 -77 3 -75 Z',
            fill: '#ffd08a', opacity: '.94'
          }));
          anchor.appendChild(flame);
          nodes[id].appendChild(anchor);
          flames.push({ element: flame, phase: index * .8 + wheelIndex * 2 });
        }
      });

      const sparks = Array.from({ length: 14 }, (_, index) => {
        const element = svgElement('circle', { r: index % 3 === 0 ? 2.4 : 1.3 });
        nodes.sparks.appendChild(element);
        return element;
      });

      const transform = (id, value) => nodes[id].setAttribute('transform', value);
      function bendLeg(hipX, hipY, ankleX, ankleY) {
        const thigh = 90;
        const shin = 92;
        const dx = ankleX - hipX;
        const dy = ankleY - hipY;
        const length = Math.max(.001, Math.hypot(dx, dy));
        const along = (thigh * thigh - shin * shin + length * length) / (2 * length);
        const height = Math.sqrt(Math.max(0, thigh * thigh - along * along));
        const kneeX = hipX + (dx * along + dy * height) / length;
        const kneeY = hipY + (dy * along - dx * height) / length;
        return `M ${hipX} ${hipY} L ${kneeX.toFixed(2)} ${kneeY.toFixed(2)} L ${ankleX.toFixed(2)} ${ankleY.toFixed(2)}`;
      }

      function draw(t) {
        const angle = t * turn / 1.35 + .25;
        const degrees = angle * 180 / Math.PI;
        const frontX = 573 + Math.cos(angle) * 25;
        const frontY = 516 + Math.sin(angle) * 25;
        const backX = 573 - Math.cos(angle) * 25;
        const backY = 516 - Math.sin(angle) * 25;
        const nearLeg = bendLeg(536, 365, frontX - 3, frontY - 15);
        nodes['near-leg'].setAttribute('d', nearLeg);
        nodes['near-leg-edge'].setAttribute('d', nearLeg);
        nodes['far-leg'].setAttribute('d', bendLeg(523, 366, backX - 3, backY - 15));
        transform('near-foot', `translate(${frontX} ${frontY})`);
        transform('far-foot', `translate(${backX} ${backY})`);
        transform('crank', `rotate(${degrees})`);
        transform('front-spokes', `rotate(${degrees * 1.1})`);
        transform('rear-spokes', `rotate(${degrees * 1.1})`);
        transform('front-flames', `rotate(${-degrees * .18})`);
        transform('rear-flames', `rotate(${-degrees * .18 + 8})`);
        transform('riding-group', `translate(0 ${Math.sin(angle * 2) * 1.4})`);
        transform('hair-ribbon', `rotate(${Math.sin(t * 7) * 7})`);
        flames.forEach(flame => flame.element.setAttribute('transform', `scale(1 ${.94 + Math.sin(t * 9 + flame.phase) * .075})`));

        const wave = Math.sin(t * 4) * 11;
        const flutter = Math.cos(t * 4.6) * 7;
        nodes['long-silk'].setAttribute('d', `M 555 251 C 500 220 485 ${242 + flutter} 446 ${255 + flutter} S 366 ${275 + wave} 331 ${241 + wave} S 254 ${206 - wave} 216 ${227 - wave} L 205 ${211 - wave} C 260 ${185 - wave} 303 ${193 + wave} 346 ${228 + wave} S 409 ${253 + flutter} 449 ${235 + flutter} S 511 203 564 237 Z`);
        nodes['silk-highlight'].setAttribute('d', `M 548 244 C 491 218 482 ${244 + flutter} 446 ${245 + flutter} S 374 ${266 + wave} 338 ${235 + wave} S 262 ${196 - wave} 216 ${217 - wave}`);
        nodes['short-silk'].setAttribute('d', `M 551 274 Q 483 ${305 + flutter} 426 ${291 + wave * .4} Q 398 ${284 + wave} 369 ${298 + wave} L 382 ${283 + wave} L 367 ${276 + wave} Q 399 ${259 + wave} 435 ${275 + wave * .4} Q 483 ${290 + flutter} 547 258 Z`);
        const blink = t % 5.2;
        transform('eye', `scale(1 ${blink > 4.95 && blink < 5.09 ? .08 : 1})`);

        transform('mountain-layer', `translate(${-((t * 18) % 1120)} 0)`);
        transform('gate-layer', `translate(${-((t * 27) % 1120)} 0)`);
        transform('cloud-road', `translate(${-((t * 420) % 280)} 0)`);
        transform('sky-cloud-left', `translate(${Math.sin(t * .15) * 19} ${Math.sin(t * .25) * 3})`);
        transform('sky-cloud-right', `translate(${Math.sin(t * .12 + 1) * 22} 0)`);
        nodes['riding-shadow'].setAttribute('rx', 244 + Math.sin(angle * 2) * 4);
        stars.forEach((star, index) => star.setAttribute('opacity', .35 + (Math.sin(t * 1.4 + index * 1.8) + 1) * .28));
        sparks.forEach((spark, index) => {
          const life = (t * .75 + index / sparks.length) % 1;
          const originX = index % 2 ? 738 : 360;
          spark.setAttribute('cx', originX - life * (90 + index * 5));
          spark.setAttribute('cy', 564 - life * (12 + (index % 5) * 9) + Math.sin(life * 9 + index) * 4);
          spark.setAttribute('opacity', Math.sin(life * Math.PI) * .8);
        });
      }

      function animate(timestamp) {
        request = null;
        if (!playing || document.hidden) { lastTimestamp = null; return; }
        if (lastTimestamp !== null) time += Math.min((timestamp - lastTimestamp) / 1000, .05) * rate;
        lastTimestamp = timestamp;
        draw(time);
        request = requestAnimationFrame(animate);
      }

      function synchronize() {
        if (request !== null) cancelAnimationFrame(request);
        request = null;
        lastTimestamp = null;
        playButton.textContent = playing ? '暂停片刻' : '继续出发';
        playButton.setAttribute('aria-pressed', String(!playing));
        speedButton.textContent = rate === 1 ? '踏风 ×1' : '追风 ×1.6';
        speedButton.setAttribute('aria-pressed', String(rate !== 1));
        status.textContent = !playing ? '歇一歇，云海也很好看。' : rate === 1 ? '风火轮已就位，出发！' : '混天绫扬起，追风去！';
        if (playing && !document.hidden) request = requestAnimationFrame(animate);
      }

      playButton.addEventListener('click', () => { playing = !playing; synchronize(); });
      speedButton.addEventListener('click', () => { rate = rate === 1 ? 1.6 : 1; synchronize(); });
      reducedMotion.addEventListener('change', event => { playing = !event.matches; synchronize(); });
      document.addEventListener('visibilitychange', synchronize);
      draw(0);
      synchronize();
    })();
  </script>
</body>
</html>
